<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 시대 하네스 엔지니어링 특강</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif; background: #0a0a0a; color: #e0e0e0; height: 100vh; overflow: hidden; }
  .slide { display: none; flex-direction: column; justify-content: center; padding: 8vh 10vw; height: 100vh; }
  .slide.active { display: flex; }
  .slide.section { justify-content: center; align-items: center; }
  .slide.section h1 { font-size: clamp(2rem, 5vw, 4rem); font-weight: 700; line-height: 1.3; text-align: center; color: #fff; }
  .slide h2 { font-size: clamp(1.4rem, 3vw, 2.2rem); font-weight: 600; line-height: 1.4; margin-bottom: 3vh; color: #fff; }
  .slide .body { display: flex; flex-direction: column; gap: 1.2vh; }
  .slide .body .item { font-size: clamp(1rem, 1.8vw, 1.4rem); line-height: 1.6; color: #bbb; }
  .slide .body .item.d0 { color: #e0e0e0; font-size: clamp(1.1rem, 2vw, 1.5rem); }
  .slide .body .item.d1 { padding-left: 2em; }
  .slide .body .item.d2 { padding-left: 4em; font-size: clamp(0.9rem, 1.5vw, 1.2rem); color: #999; }
  .slide .body .item.d3 { padding-left: 6em; font-size: clamp(0.85rem, 1.3vw, 1.1rem); color: #777; }
  .counter { position: fixed; bottom: 2vh; right: 3vw; font-size: 0.9rem; color: #555; }
  .progress { position: fixed; top: 0; left: 0; height: 3px; background: #4a9eff; transition: width 0.3s; }
</style>
</head>
<body>
<div class="progress" id="progress"></div>
<div id="deck"></div>
<div class="counter" id="counter"></div>
<script>
const slides = [{"heading":"프롤로그","level":"section","lines":[{"text":"LLM은 언어 예측 모델이다","depth":0},{"text":"언어는 모호함 그 자체인데 개발은 0과 1의 세계, 하나라도 틀리면 안 돌아감","depth":0},{"text":"그런데? 바이브 코딩 — 내가 원하는걸 네가 학습한대로 요청하면 코드가 나온다","depth":0},{"text":"그런데? 쓰레기를 넣으면 쓰레기가 나온다 — 자가 수렴이 안 되는 구조, 수정할수록 코드가 나빠짐","depth":0},{"text":"어떻게 가능? 그런데도 잘 돌아가는 이유 — 이미 잘 만들어진 추상화 계층 (디지털 논리회로부터 인류가 쌓아온 개발 계층)","depth":0}]},{"heading":"그러면? 일부러 정보를 안주고 일을 시키면 진짜 인턴이나 알바가 됨","level":"slide","lines":[{"text":"현재 수준은? 특이점은 오지 않았지만 임계점을 돌파, 단순 코딩 업무 70-80% 확률로 작동, 4번 안에 정답","depth":0}]},{"heading":"그래서? 바이브 코딩이 되는 것과 안되는 것이 구분되는 시대, 그래서 어떻게 하는가?","level":"section","lines":[{"text":"그런데? 안 쓸거냐? 쓸모와 편리를 이미 경험, 캐즘은 이미 넘어간 기술","depth":0}]},{"heading":"답은? 하네스 엔지니어링 — 규칙과 규격으로 AI가 잘 할 수 있는 구조를 만든다","level":"slide","lines":[{"text":"어떻게? 안된다고 말하기 — 지침, 지도, 이렇게 하세요, 안되면 벌점","depth":1},{"text":"예시? 10시까지 오자 ㅇㅋ, 지각하면 벌금","depth":2},{"text":"왜? 회사가 규칙이 없으면 어뷰저가 생김, 너무 빡빡하면 비효율과 관행 — 좋은 규칙과 프로세스가 필요","depth":1},{"text":"결과적으로? 일관성 해법 — 반복되는 프롬프트를 작성하게 하지 말고 작성하자 (함수)","depth":2}]},{"heading":"답은? 계획과 실행을 분리한다 — task.md로 모든 일을 가능한 수준으로 바꾼 다음 하나씩","level":"slide","lines":[{"text":"어떻게? 컨텍스트 엔지니어링 — 좋은 컨텍스트를 왕창 넣어 예측을 잘 하게 (claude.md, chain of thought)","depth":1},{"text":"실제로는? 아는 사람에게는 엄청난 힌트, 뭐 넣어야 하지를 모를때와 뭐라도 보여줄때 사고가 다르게 동작","depth":2},{"text":"또한 틀려도 되는 거 찾아보기 검색 대용","depth":2},{"text":"또한 대화상대가 생기면서 생각정리 문서 정리 수준으로 ok","depth":2},{"text":"왜? 컨텍스트 격리 — 컨텍스트를 적게 주면서 계획을 세워서","depth":1},{"text":"구체적으로? 매번 말로 하다보면 반복을 찾을 수 있다","depth":2},{"text":"도구? 구분할 수 있는 장치 (템플릿) 빈칸채우기 — 순서대로 채운다는 것을 활용","depth":3},{"text":"적용? 워크플로 구조화 — 촘촘하게 느슨하게 순서바꿔서","depth":4},{"text":"발견? 안티패턴의 발견","depth":5},{"text":"그 다음? 스킬 개선과 써먹기 벤치마킹","depth":6},{"text":"보조 수단? 인턴을 부리는 법 — 자료조사, 단순 테스트, 심미성 평가 (실행 에이전트의 컨텍스트 소진을 막아줌)","depth":1},{"text":"왜 인간이? 인간이 함께 일하면 잘하는 이유 — 다양성, 모르는 뇌로 바라보면 새로운 시각","depth":2}]},{"heading":"답은? 개발자의 역할 — 구조화 능력과 설명하는 능력 = 논리와 인과","level":"slide","lines":[{"text":"왜 취향? 뭐라도 인풋이 있어야 한다, 그걸 내가 하는 역할 — 취향적 평가","depth":1},{"text":"비유? 결혼정보회사나 소개팅? 그 결정도 남에게 미룰건가 — 취향과 조예","depth":2},{"text":"적용? 패션, 개발자가 되고 싶다면 개발에 취향과 조예","depth":3},{"text":"구체적으로? 개발자 역할 계층 — 워크플로 판매(창업) → 물건 제작 → 서빙/유지보수 → 도구 → 인프라 → 복잡성 축소","depth":1},{"text":"그래서? 회사에서 필요한 인재는 후자(인프라/도구), 창업에서 필요한 인재는 전자(워크플로/제품)","depth":2},{"text":"시대 맥락? 대 AI 하이프 시대 — 시행착오와 노하우의 시대, 어떻게 해야 잘 하는지는 아무도 답을 모른다","depth":1},{"text":"비유? 마치 연애 같은것 — 방법이야 많은데 내가 하면 잘 안됨, 전문가 방식이 나에게 맞다는 보장 없음","depth":2},{"text":"구체적으로? 쉬운 문제와 어려운 문제의 구별 (감)","depth":2},{"text":"무엇이 문제? 컨텍스트의 함정 — 많은 컨텍스트를 넣을수록 일을 많이 할수록 바보가 된다","depth":0}]},{"heading":"기다리면? 기다리면 더 좋은 모델이 나오겠지, 지금 배운게 무쓸모 한거 아닐까?","level":"slide","lines":[{"text":"또한 일관성의 문제 — 매번 반복되는 프롬프트를 매번 작성하게 된다","depth":0},{"text":"또한 배운게 도둑질이라 사람하고 똑같다 — 골 픽세이션, 확증 편향, 자기 변호","depth":0},{"text":"결과적으로 내가 짠 코드를 내가 평가하면 잘했는지 못했는지 알기 어려움","depth":0}]},{"heading":"그러면? 디자인없이 개발해주세요, 일단 알아서 만들어주세요 — 안되면 안된다고 해야 하는데 최선을 다해 토큰을 쪽쪽 뽑아감","level":"slide","lines":[]}];
let idx = 0;
const deck = document.getElementById('deck');
const counter = document.getElementById('counter');
const progress = document.getElementById('progress');

slides.forEach((s, i) => {
  const div = document.createElement('div');
  div.className = 'slide' + (s.level === 'section' ? ' section' : '') + (i === 0 ? ' active' : '');
  div.dataset.idx = i;
  if (s.level === 'section') {
    div.innerHTML = '<h1>' + esc(s.heading) + '</h1>';
  } else {
    let html = '<h2>' + esc(s.heading) + '</h2><div class="body">';
    for (const item of s.lines) {
      const d = Math.min(item.depth, 3);
      html += '<div class="item d' + d + '">' + esc(item.text) + '</div>';
    }
    html += '</div>';
    div.innerHTML = html;
  }
  deck.appendChild(div);
});

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function go(n) {
  const next = Math.max(0, Math.min(slides.length - 1, idx + n));
  if (next === idx) return;
  deck.children[idx].classList.remove('active');
  idx = next;
  deck.children[idx].classList.add('active');
  counter.textContent = (idx + 1) + ' / ' + slides.length;
  progress.style.width = ((idx + 1) / slides.length * 100) + '%';
}

counter.textContent = '1 / ' + slides.length;
progress.style.width = (1 / slides.length * 100) + '%';

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') go(1);
  else if (e.key === 'ArrowLeft') go(-1);
});
document.addEventListener('click', e => {
  if (e.clientX > window.innerWidth / 2) go(1); else go(-1);
});
</script>
</body>
</html>
