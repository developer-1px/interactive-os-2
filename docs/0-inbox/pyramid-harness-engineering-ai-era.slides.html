<script>
const slides = [{"heading":"프롤로그","level":"section","lines":[{"text":"나도 정답은 모르지만, AI를 실무에 더 많이 써본 경험은 있다","depth":0},{"text":"그런데 FE 개발을 배운 취준생들이 AI 시대에 현업에 진입하려 한다","depth":0},{"text":"그런데 작년까지만 해도 LLM은 보조도구, 내가 코딩하는게 메인이라는게 정배였다","depth":0},{"text":"그런데 LLM으로 개발하는 것이 기정사실화되고 있다","depth":0},{"text":"구체적으로? 바이브 코딩 — 요청하면 코드가 나오는 세상","depth":1},{"text":"그래서 LLM 수준이 높아지면서 정말로 LLM만으로 코딩을 할 수 있게 되고 생산성이 높아진다는게 증명되고 있다","depth":0},{"text":"그래서 원래는 코딩노동력이 필요해서 뽑았던 신입인데 그럴 필요가 줄어들면서 AI 시대에 주니어들에게는 새로운 채용 허들이 생겼다","depth":0},{"text":"그런데 왜 주니어를 채용해서 AI를 활용하게 하지 않을까?","depth":0}]},{"heading":"이렇게 하면? 하네스 없이 바이브 코딩만 하면, 만들수록 코드가 망가진다","level":"slide","lines":[{"text":"왜? 자연어는 모호함 그 자체인데, 개발은 하나라도 틀리면 안 돌아가는 0과 1의 세계다","depth":1},{"text":"그런데? 그런데도 돌아가는 건 인류가 쌓아온 추상화 계층 덕분이지, LLM이 잘해서가 아니다","depth":2},{"text":"왜? LLM은 비결정적 출력을 하도록 만들어졌다 — 결과의 방향성은 있지만 랜덤이고, 좋은 곳으로 수렴하도록 만들어진게 아니라서 반복하면 엔트로피가 높아진다","depth":1},{"text":"왜 랜덤인가? temperature=0으로 해도 완전히 같은 결과가 안 나온다 — GPU 부동소수점 연산의 라운딩 오차가 매번 다르기 때문. 결정론적으로 만들 수 없는 구조다","depth":2},{"text":"실제 데이터는? GitClear(2024, 211M줄 분석) — AI 코드의 중복 8배 증가, 2주 내 재수정 비율 5.5→7.9%, 리팩토링 비중 25→10%로 감소. 만들기만 하고 정리를 안 한다","depth":2},{"text":"예를 들면? 디자인 없이 만들어달라고 하면 안 된다고 해야 하는데, LLM은 최선을 다해 만든다 — 토큰만 쪽쪽 빠져나간다","depth":2},{"text":"누적하면? 1턴의 출력 상한이 있어서 여러 턴에 걸쳐야 한다 — 그런데 70% 성공률도 누적하면 처참하다","depth":2},{"text":"계산하면? 0.7^5 = 17%, 0.7^10 = 3% — 5턴만 지나도 목표 도달 확률이 1/6, 10턴이면 사실상 실패","depth":3},{"text":"더 나쁜 건? 내 요구사항이 1턴에 되는지 N턴에 되는지 LLM도 나도 모른다","depth":3},{"text":"그래서? 1턴에 안 되는 요구사항을 내면 LLM이 1턴 안에 하겠다고 하다가 조잡한 결과를 낸다","depth":4},{"text":"왜? 컨텍스트를 왕창 넣으면 해결될 줄 알았는데, 많이 넣을수록 오히려 바보가 된다","depth":1},{"text":"구체적으로? 골 픽세이션, 확증 편향, 자기 변호가 생긴다 — 주니어가 사회 초년기에 일 못하는 시행착오와 판박이다","depth":2},{"text":"논문은? Lost in the Middle(Stanford, 2023) — 정보가 컨텍스트 앞·끝에 있으면 잘 찾고, 중간에 있으면 급격히 못 찾는다. U자형 성능 곡선. 길어질수록 더 심해진다","depth":2},{"text":"어떻게 시도했나? 컨텍스트 엔지니어링 시도 — claude.md, chain of thought 등 좋은 컨텍스트를 왕창 넣자는 접근","depth":2},{"text":"용어는? Karpathy(2025)가 프롬프트 엔지니어링 대신 컨텍스트 엔지니어링이라 불렀다 — LLM이 문제를 풀 수 있도록 모든 맥락을 제공하는 기술. 하지만 넣는 것만으로는 부족하다","depth":3},{"text":"왜? 내가 짠 코드를 내가 평가하면 잘했는지 못했는지 알 수 없다","depth":1},{"text":"예를 들면? 전임자가 못했나 보네요 — 그 전임자가 3분 전의 나라는 걸 모른다","depth":2},{"text":"해법은? 인간이 함께 일하면 잘하는 이유는 다양성이다 — 모르는 뇌로 바라보면 새로운 시각이 나온다","depth":2},{"text":"원리는? 자��가 한걸 자기가 평가하면 우호적으로 평가해. 사람도 그런데 AI도 그래. AI는 많이 본걸 따라가는 성향이 있으니까","depth":3}]},{"heading":"그래서 AI가 코딩을 해주는 시대에, 개발자 지망생은 뭘 준비해야 하나?","level":"section","lines":[]},{"heading":"답은 LLM을 써서 생산성을 낼 수 있는 역량을 갖추는 것이다 — 같은 AI를 써도 사람에 따라 효율이 다르니까","level":"slide","lines":[{"text":"#### 어떻게? 하네스를 배우고, 계획과 실행을 분리한다","depth":0},{"text":"##### 핵심은? 하네스 엔지니어링이다 — 내가 의도한 방향으로 수렴할 수 있게 해주는 장치. 스스로는 그쪽으로 갈 수 없으니까","depth":0},{"text":"왜? 회사에 규칙이 없으면 어뷰저가 생기듯, LLM에 제약이 없으면 품질이 발산한다","depth":2},{"text":"예를 들면? 10시까지 오자는 약속이 아니라 지각하면 벌금이 규칙이다 — 단, 너무 빡빡하면 리추얼이 되어 토큰 소모처가 된다","depth":3},{"text":"왜? 반복되는 프롬프트를 매번 쓰게 하지 말고 함수처럼 한 번 작성해서 재사용한다 — 일관성의 문제","depth":2},{"text":"왜 함수인가? AI의 처리량은 정해져 있다 — 컨텍스트+입력+출력이 같은 예산을 나눠 쓰므로, 컨텍스트를 늘리면 출력 품질이 줄어든다. 함수는 컨텍스트를 늘리��� 게 아니라 압축하는 것이다","depth":3},{"text":"수단은? 안 되는 것을 안 된다고 말하고, 지침과 규격으로 행동을 제한하는 것","depth":2},{"text":"전제는? LLM에게 코딩을 시키면 모델이 지향하는 수렴점이 있다 — 퀄리티는 높지만 상용화 수준은 아니다. 그 방향 안의 요구사항은 LLM이 잘하지만, 밖이거나 더 높은 퀄리티를 원하면 프롬프트·컨텍스트·훅으로 의도대로 이끌어야 한다","depth":2},{"text":"그러려면? LLM이 기본적으로 잘하는 것과 못하는 것에 대한 감이 있어야 한다 — 그 감이 없으면 하네스를 어디에 걸어야 하는지 모른다","depth":3},{"text":"어떻게 키우나? LLM이 만들어주는 수준 너머의 문제를 해결하는 걸 만들어봐야 한다 — 수렴점 바깥을 경험해야 경계가 보인다","depth":4},{"text":"##### 도구는? 하네스의 도구 — 컨텍스트(부탁), 스킬(절차), 에이전트(고용), 훅(강제)","depth":0},{"text":"부탁 컨텍스트 — 이렇게 해달라고 부탁하는 것. 강제성은 없다","depth":2},{"text":"핵심은? 메모리 — 세션이 끝나면 컨텍스트가 사라지니까 다음 세션이 알아야 할 것을 파일로 남긴다. 피드백, 프로젝트 맥락, 설계 원칙 등","depth":3},{"text":"팁은? 많이 하면 알아서 쌓인다 — 메모리는 기본 기능이 되었다. 피드백을 주면 자동으로 기록한다. 핵심은 처음부터 잘 쓰려고 하지 말고 일단 많이 쓰는 것","depth":4},{"text":"절차 스킬 — 이 순서로 해달라고 부탁하는 것. 템플릿과 절차로 해석을 고정한다","depth":2},{"text":"사례: 논의 스킬 LLM에게 뭔가 논의하자고 하면 내 의도를 모른 채 알겠다고 해버린다 — 1턴짜리는 괜찮은데 범위가 큰 논의가 안 된다","depth":3},{"text":"해법은? 반드시 알아야 하는 12가지를 정의하고, 이해도가 채워지기 전까지 진행을 못하게 막았다 — 빈칸이 있으면 그 빈칸을 질문한다","depth":4},{"text":"핵심은? 순서가 중요하다 — 목적→배경→이상→현실→문제→원인→제약→자산→목표→해결. 앞이 빈 채로 뒤를 채우면 방향이 틀어진다. 🔴를 만나면 거기서 멈춘다","depth":5},{"text":"결과는? LLM이 '알겠다'고 넘어가는 게 구조적으로 불가능해진다 — 빈칸이 질문을 강제하니까","depth":6},{"text":"사례: 리팩토링 스킬 단일책임에 맞게 리팩토링해달라? 안 된다 — '단일책임'의 해석이 모호하면 매번 다른 결과가 나온다","depth":3},{"text":"왜? LLM은 매 세션마다 다른 친구들이 온다 — 같은 말을 해도 해석이 달라진다. 스킬은 해석이 모호하면 안 된다","depth":4},{"text":"해법은? '파일명과 실제 책임이 불일치하는 곳을 찾아라'처럼 판단 기준을 구체적으로 박아넣는다 — 모호한 원칙이 아니라 실행 가능한 절차","depth":5},{"text":"만드는 법은? 매번 말로 시키다 보면 같은 말을 반복하는 지점이 보인다 — 그 반복이 스킬의 후보. 말로 3번 하면 파일로 굳힌다","depth":3},{"text":"구조는? 템플릿(빈칸) + 순서(인과) + 정지 조건(🔴면 멈춤) — 이 세 가지가 스킬의 뼈대","depth":4},{"text":"핵심 원칙은? 해석이 갈리면 안 된다 — 원칙이 아니라 절차를 쓴다. 누가 와도 같은 결과가 나와야 스킬이다","depth":5},{"text":"핵심 원리 Chain of Thought의 강제력 — 결론을 먼저 내리지 못하게 하고 사고 과정을 거치게 강제하면 품질이 올라간다. 스킬의 가장 큰 인사이트","depth":3},{"text":"논문은? Kojima et al.(2022) — 'Let's think step by step' 한 줄로 MultiArith 17.7%→78.7%, GSM8K 10.4%→40.7%. 사고 과정을 강제하는 것만으로 정확도가 2~5배","depth":4},{"text":"현실은? 스킬은 내가 쓰는 게 아니라 LLM에게 써달라고 시키는 건데, LLM이 스킬을 잘 쓰지 않는다 — 최대한 따르려 하지만 내가 읽어보고 개선이 필요하다","depth":4},{"text":"해법은? skill-creator가 스킬 없이 모델만으로 나온 결과와 스킬을 써서 나온 결과를 비교 분석해준다 — 모델만으로 잘하면 그 스킬은 필요 없다. 추가 토큰과 컨텍스트를 쓰는 거니까","depth":5},{"text":"다회성은? 1회성 스킬은 한 번 비교로 확인되지만, 다회성 스킬은 없을 때와 있을 때를 번갈아가면서 체감 효과를 분석해야 한다","depth":6},{"text":"주의할 점은? 계속 깎을수록 더 잘되기도 하지만, 과하게 스킬이 만들어지면 역효과가 난다 — 적정선이 있다","depth":7},{"text":"어떤 역효과? 제약과 컨텍스트가 많으면 자율성을 잃는다 — LLM이 스스로 판단할 여지가 사라진다","depth":8},{"text":"논문은? arXiv 2512.14754(2025) — 제약 수가 늘어날수록 LLM의 instruction-following 신뢰도가 불안정해진다. 3,000토큰 이후 추론 성능이 떨어지기 시작한다","depth":9},{"text":"어떤 역효과? 리뷰가 너무 느슨해서 잘못된 위주로 보라고 하면, 잘한 것도 억지로 흠을 찾아 크리틱하고 그걸 받아들여 코드를 수정하면 더 나쁜 결과를 얻는다","depth":8},{"text":"논문은? Valmeekam et al.(2023) — LLM 자기 비평은 외부 검증 없이는 계획 품질을 오히려 떨어뜨린다. Pan et al.(TACL 2025) — 외부 피드백 없는 self-correction은 결과를 악화시킬 수 있다","depth":9},{"text":"어떤 역효과? 스킬을 쓰는 만큼 출력 예산이 줄어든다 — 스킬이 너무 많으면 그만큼 받을 수 있는 결과의 양이 줄어든다","depth":8},{"text":"기술적으로? 컨텍스트+입력+출력이 같은 토큰 예산 — attention 연산은 토큰 수의 제곱에 비례하고, 200K 모델도 50K 이후부터 품질이 떨어지기 시작한다","depth":9},{"text":"고용 에이전트 — 스킬이 매뉴얼이라면 에이전트는 사람을 고용하는 것. 맥락을 공유하지 않고 일을 시킬 수 있다","depth":2},{"text":"왜 필요한가? 컨텍스트 rot — 대화가 길어질수록 LLM이 바보가 된다. 컨텍스트+입력+출력이 같은 예산이라 앞의 대화가 쌓일수록 뒤의 품질이 떨어진다","depth":3},{"text":"해법은? 에이전트는 새 컨텍스트에서 시작한다 — 필요한 것만 전달하고 나머지는 격리. 맥락 소진 없이 LLM을 쓰는 법","depth":4},{"text":"예를 들면? 코드 리뷰를 시키면서 내 대화 맥락을 안 주면 — 편견 없이 코드만 보고 판단한다. 모르는 뇌가 보는 효과","depth":5},{"text":"강제 훅 — 컨텍스트·스킬·에이전트로 안 되는 걸 할 수 있게 하는 도구. 부탁이 아니라 강제다","depth":2},{"text":"사례는? 300줄이 넘어가면 입력을 못하게 하고 /srp를 강제한다 — LLM이 무시할 수 없다. 컨텍스트나 스킬과 달리 선택지가 없다","depth":3},{"text":"사례는? git stash, reset --hard 같은 파괴적 명령을 구조적으로 차단한다 — 실수로 코드를 날리는 게 불가능해진다","depth":3},{"text":"사례는? 코드를 수정했는데 테스트를 안 돌렸으면 세션 종료를 차단한다 — 테스트를 돌려야 끝낼 수 있다","depth":3},{"text":"사례는? style={{}}이나 addEventListener를 직접 쓰면 차단한다 — 프로젝트의 규칙을 LLM이 무시 못하게 강제","depth":3},{"text":"만드는 법은? 만들어달라고 하면 만들어준다 — 훅도 코드니까. 안 되는 걸 발견하면 이거 막아달라고 하면 된다","depth":3},{"text":"##### 구체적으로? 계획과 실행을 분리하고, 컨텍스트를 의도적으로 제한해서 단계별로 시킨다","depth":0},{"text":"왜? 인턴을 부리듯 자료조사, 단순 테스트, 심미성 평가를 따로 시키면 실행 에이전트의 컨텍스트 소진을 막는다","depth":2},{"text":"구체적으로? 일부러 정보를 안주고 일을 시키기 — 인턴·알바 수준이 되지만, 실행 에이전트의 컨텍스트 소진을 막는다. 이걸로 뭘 할 수는 없고 전달이 전부","depth":3},{"text":"왜? 쉬운 문제와 어려운 문제를 구별하는 감이 필요하다 — 없으면 템플릿 빈칸채우기로 구분 장치를 만든다","depth":2},{"text":"원리는? 원리는 알아. 잘게 쪼개주면 시행착오 없이 일을 한다는 거잖아. 근데 어느 정도가 1턴이나 2턴만에 해결되는 수준인지는 감이야. 그 감이 경험","depth":3},{"text":"기본 제공은? plan 모드가 LLM 스스로 1턴의 양을 조절해서 계획을 짜고 하나씩 하는 도구다 — 기본 제공 하네스","depth":2},{"text":"한계는? 범용적인 plan 모드가 모든 곳에 맞지 않는다 — 각자의 도메인에 맞는 스킬을 만들어야 한다","depth":3},{"text":"그래서 매번 말로 하다 보면 반복 패턴을 찾을 수 있다 — 그걸 스킬로 굳히고, 안티패턴을 발견하고, 벤치마킹으로 개선한다","depth":4},{"text":"착지점은? 로드맵 — 스킬을 만들자. 뭘? 실제로 나아지니?","depth":5},{"text":"예를 들면? 아이디어 → 계획 → 실행 → 평가, 이 순서를 워크플로로 고정한다 — 산출물이 있어야 다음 단계가 가능하다","depth":2},{"text":"조절은? 촘촘/느슨 조절 — LLM이 잘하는 영역은 느슨하게(한 번에 점프), 실패가 비싼 영역은 촘촘하게(단계별 확인). 그 구분이 경험","depth":2}]},{"heading":"답은 LLM을 써서 생산성을 낼 수 있는 역량을 갖추는 것이다 — 같은 AI를 써도 사람에 따라 효율이 다르니까","level":"slide","lines":[{"text":"#### 그래서? 남는 것을 알고, 내일부터 시작한다","depth":0},{"text":"##### 뭐가 남지? AI 시대 개발자에게 남는 건 취향과 조예, 구조화와 설명 능력이다","depth":0},{"text":"먼저 회사든 창업이든 둘 다에게 필요한 건 구조화 능력과 설명하는 능력 — 논리와 인과","depth":2},{"text":"구체적으로? 뭘 넣어야 하는지 아는 사람과 모르는 사람의 사고가 다르게 동작한다 — 틀려도 되니까 검색 대용, 대화상대로 생각정리가 된다","depth":3},{"text":"예를 들면? 대화상대가 생기면서 생각정리·문서 정리 수준으로 충분히 OK","depth":4},{"text":"3단계 ① 설명할 수 있어야 한다 — 내 맥락, 내 목표, 내 취향을 LLM에게 계속해서 설명할 수 있어야 한다. 두 번 말하지 않기 위해서","depth":3},{"text":"그 다음 ② 지시하고 요청할 수 있어야 한다 — 설명한 것을 바탕으로 구체적으로 시킬 수 있어야 한다","depth":4},{"text":"그 다음 ③ 시스템을 만들 수 있어야 한다 — 지시가 아니라 시스템. 매번 지시하는 게 아니라 한 번 만들어두면 돌아가는 것","depth":5},{"text":"그리고 결혼정보회사가 후보를 줘도 선택은 내가 한다 — 그 판단을 남에게 미룰 건가?","depth":2},{"text":"왜? LLM은 끊임없이 나에게 결정을 요구한다 — 하라는 대로 따라가면 LLM이 도달하는 그곳으로 간다. 그게 싫으면 내 생각대로 가자고 해야 한다","depth":3},{"text":"핵심은? 어떤 질문은 옳은 방향이 있고, 어떤 질문은 취향의 문제다 — 그걸 구분하는 눈과 경험이 있어야 한다. 그게 취향이 중요한 이유다","depth":4},{"text":"그리고 시행착오를 내가 해야 한다 — 기다린 사람에겐 노하우가 없다","depth":3},{"text":"왜? 대 AI 하이프 시대 — AI 원리는 알지만 어떻게 해야 잘 하는지는 아무도 답을 모른다","depth":4},{"text":"예를 들면? 마치 연애 같은 것 — 방법은 많은데 내가 하면 안 되고, 남의 방식이 나한테 맞는다는 보장도 없다. 운도 환경도 시기도 방법도","depth":4},{"text":"구체적으로? 개발자가 되고 싶다면 개발에 취향과 조예가 있어야 한다 — 개발자는 문제해결사다. 문제를 풀고 싶은 사람이어야 한다","depth":3},{"text":"예를 들면? 패션 — 취향을 가장 직관적으로 보여주는 비유","depth":3},{"text":"##### 내일부터 뭘 해? 경험을 누적하고, 안 되는 지점에서 스킬을 만들어라 — 첫 번째 스킬은 스킬을 만드는 스킬이다","depth":0},{"text":"왜? 메모리가 쌓이듯 경험이 쌓여야 한다 — 많이 쓸수록 LLM의 한계가 어디인지 감이 생긴다","depth":2},{"text":"예를 들면? 해결책을 제안하고 근거를 쓰라고 했더니 — 해결이 이미 피상적인데 근거는 그 얕은 해결의 변명이었다. 물어보면 오히려 확신이 강해진다. 결론→근거 순서가 확증 편향을 만든다","depth":3},{"text":"그래서? 순서를 뒤집었다 — 배경정보를 먼저 수집하고 사실 근거를 모은 다음 결론을 내라고 하면 더 잘한다. 이 한 줄이 경험에서 나온 규칙이다","depth":4},{"text":"어떻게? 안 된다 싶을 때가 스킬을 만들 때다 — 스킬을 만들고 더 잘되는 경험을 해야 다음 스킬이 보인다","depth":2},{"text":"첫 번째는? skill-creator — 스킬을 만드는 스킬. 이게 있으면 나머지는 필요할 때 만든다","depth":3},{"text":"그 다음은? 스킬을 쓰고 세션을 끝내면 개선 방향을 업데이트하는 스킬도 만들 수 있다 — 스킬이 스킬을 개선하는 루프. 쓸수록 좋아진다","depth":4},{"text":"결론은? LLM에게 해줘 하면 해주는 건 맞다. 근데 1턴에 해줄 수 있는 게 있고 해줄 수 없는 게 있다","depth":2},{"text":"그래서? 해줄 수 없는 걸 해달라고 하면 못한다. 근데 그걸 해줄 수 있는 것들로 쪼개면 해낼 수 있다","depth":3},{"text":"근데? 그걸 어떻게 해야 하는지는 아직 아무도 제대로 모른다 — 다들 찾아가고 있는 중이다","depth":4},{"text":"그래서? 답이 나오면 따라가는 건 이미 늦다 — 이건 안다고 되는 게 아니라 경험치니까. 알면 더 빨리 따라올 수 있겠지만","depth":5},{"text":"기억할 것 왜 주니어를 안 뽑고 시니어를 쓰겠다고 하는지를 기억했으면 좋겠다 — 그건 경험의 차이니까","depth":6},{"text":"뭘 만들어야 하나? 개발자 역할 계층 — 불편→워크플로를 판다 / 쾌락 해킹 물건을 판다 / 서빙·유지보수 / 도구를 판다 / 인프라를 판다 / 복잡성을 줄인다","depth":2}]}];
let idx = 0;
const deck = document.getElementById('deck');
const counter = document.getElementById('counter');
const progress = document.getElementById('progress');

slides.forEach((s, i) => {
  const div = document.createElement('div');
  div.className = 'slide' + (s.level === 'section' ? ' section' : '') + (i === 0 ? ' active' : '');
  div.dataset.idx = i;
  if (s.level === 'section') {
    div.innerHTML = '<h1>' + esc(s.heading) + '</h1>';
  } else {
    let html = '<h2>' + esc(s.heading) + '</h2><div class="body">';
    for (const item of s.lines) {
      const d = Math.min(item.depth, 3);
      html += '<div class="item d' + d + '">' + esc(item.text) + '</div>';
    }
    html += '</div>';
    div.innerHTML = html;
  }
  deck.appendChild(div);
});

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function go(n) {
  const next = Math.max(0, Math.min(slides.length - 1, idx + n));
  if (next === idx) return;
  deck.children[idx].classList.remove('active');
  idx = next;
  deck.children[idx].classList.add('active');
  counter.textContent = (idx + 1) + ' / ' + slides.length;
  progress.style.width = ((idx + 1) / slides.length * 100) + '%';
}

counter.textContent = '1 / ' + slides.length;
progress.style.width = (1 / slides.length * 100) + '%';

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') go(1);
  else if (e.key === 'ArrowLeft') go(-1);
});
document.addEventListener('click', e => {
  if (e.clientX > window.innerWidth / 2) go(1); else go(-1);
});
</script>
