/* ═══════════════════════════════════════════
   L2 Tokens — Semantic design value declarations
   ═══════════════════════════════════════════
   Changes when: design system values change.
   Single responsibility: :root variable declarations + theme overrides.
   No selectors, no rules — only values.
   Raw palette is in palette.css (L0). */
@layer tokens {
:root {
  /* ══ Semantic tokens (dark default) ══
     All color values reference palette.css variables.
     No hex/rgb/oklch literals here — palette is the single source. */

  /* ── Surface ── */
  --surface-base:     var(--stone-875);
  --surface-sunken:   var(--stone-950);
  --surface-default:  var(--stone-850);
  --surface-raised:   var(--stone-750);

  /* Linear: shadow는 overlay만. xs/sm은 미세, lg만 overlay급 */
  --shadow-xs: 0 1px 2px rgba(0,0,0,0.04);
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.06);
  --shadow-md: 0 2px 8px rgba(0,0,0,0.06), 0 0 1px rgba(0,0,0,0.04);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.08), 0 2px 8px rgba(0,0,0,0.06);

  /* ── Text color: 4-level hierarchy ──
     All 4 levels pass WCAG AA (4.5:1+) on every surface including overlay.
     bright/primary = AAA, secondary/muted = AA. */
  --text-bright:    var(--stone-0);
  --text-primary:   var(--stone-100);
  --text-secondary: var(--stone-200);
  --text-muted:     var(--stone-300);

  /* inverted text — 역전 surface(.sf-inverted) 전용. dark 기본은 밝은 bg에 맞춘 어두운 text */
  --text-bright-inverted:    var(--stone-950);
  --text-primary-inverted:   var(--stone-900);
  --text-secondary-inverted: var(--stone-700);
  --text-muted-inverted:     var(--stone-500);

  /* ── Border ── */
  --border-subtle:  var(--stone-850);
  --border-default: var(--stone-800);
  --border-strong:  var(--stone-600);

  --overlay-edge-top:    rgba(255,255,255, 0.12);
  --overlay-edge-bottom: rgba(255,255,255, 0.04);

  /* ── Tone: semantic color bundles (base + hover + dim + mid + bright + foreground)
     All tones share the same axis structure. dim/mid/bright = background tint 3 levels. ── */

  --tone-primary-hover:      var(--blue-400);
  --tone-primary-dim:        oklch(28%  0.037  250);
  --tone-primary-mid:        oklch(31%  0.047  250);
  --tone-primary-bright:     oklch(35%  0.052  249);

  --tone-destructive-base:       var(--red-500);
  --tone-destructive-hover:      var(--red-400);
  --tone-destructive-dim:        oklch(26%  0.051  21);
  --tone-destructive-foreground: var(--stone-0);

  --tone-success-base:       var(--green-500);
  --tone-success-hover:      var(--green-400);
  --tone-success-dim:        oklch(28%  0.034  157);
  --tone-success-foreground: var(--stone-0);

  --tone-warning-base:       var(--amber-500);
  --tone-warning-hover:      var(--amber-400);
  --tone-warning-dim:        oklch(28%  0.028  90);

  --tone-neutral-foreground: var(--stone-0);

  /* ── Focus ──

  --focus-idle:     var(--bg-hover);

  /* ── Indicator ── */
  --indicator-width: 2px;

  /* ── L1 Semantic: Elevation tier ──
     surface별 elev base + step ladder. role 토큰은 여기서 자동 파생.
     dark: +Δ L = raised (lighter on dark = elevated)

  --depth-raised-active:      oklch(from var(--elev-base-raised) clamp(0, calc(l + var(--elev-delta-3) * var(--elev-step-direction)), 0.95) c h);

  --depth-raised-sel:         oklch(from var(--elev-base-raised) clamp(0, calc(l + var(--elev-delta-2) * var(--elev-step-direction)), 0.95) c h);

  --depth-overlay-sel-context: oklch(from var(--elev-base-overlay) clamp(0, calc(l + var(--elev-delta-1) * var(--elev-step-direction)), 0.95) c h);
  --depth-overlay-sel:         oklch(from var(--elev-base-overlay) clamp(0, calc(l + var(--elev-delta-2) * var(--elev-step-direction)), 0.95) c h);
  --depth-overlay-sel-cursor:  oklch(from var(--elev-base-overlay) clamp(0, calc(l + var(--elev-delta-3) * var(--elev-step-direction)), 0.95) c h);

  --depth-prominent-sel:         var(--depth-overlay-sel);
  --depth-prominent-sel-cursor:  var(--depth-overlay-sel-cursor);

  --selection:         var(--stone-800);               /* inactive pane selection (subtle) */
  --selection-cursor:  var(--stone-750);               /* inactive pane cursor (slight raised) */
  --selection-active:         var(--stone-700);       /* active pane selection (clearly raised) */

  --type-hero-size: 40px;       --type-hero-weight: 330;    --type-hero-family: var(--serif); --type-hero-line-height: 1.5;  --type-hero-letter-spacing: -0.02em;

  /* ── Text ── */

  --text-primary:   var(--stone-900);
  --text-secondary: var(--stone-700);

  /* ── Border — subtle for layout, stronger for interactive ── */

/* ═══════════════════════════════════════════

   ═══════════════════════════════════════════
   Closed system: only these classes exist. No JIT, no escape hatch.
   Tailwind naming convention (de facto standard).

   Includes: value-free layout props + token-bound gap scale.
   Gap is included because the token scale is fixed (7 values).

   Prefer ax() for new code (ly-row, ly-column, ly-bar, ly-spread,
   ly-center, ly-scroll, ly-fill, g-*, fx-*, w-*).
   These classes remain for cases ax() doesn't cover.

   // ② 2026-03-25-css-writing-rules-prd.md
*/

/* ── Display ── */
.block         { display: block; }
.inline-block  { display: inline-block; }

.contents      { display: contents; }

/* ── Flex ── */
.flex-wrap     { flex-wrap: wrap; }

/* ── Grid ── */

/* ── Alignment ── */

.justify-end     { justify-content: flex-end; }

/* ── Sizing ── */
.min-w-0  { min-width: 0; }

/* ── Text ── */
.text-center   { text-align: center; }

.align-middle  { vertical-align: middle; }

/* ── Position ── */
.relative { position: relative; }

/* ── Interactive ── */

</style><style type="text/css" data-vite-dev-id="/Users/user/Desktop/aria/src/styles/ax.css">/* ── MECE Axis Design System — CSS Classes ──
 * 시각 6축 + 구조 6축 = 12축. 이게 전부.
 * style={} 사용 금지. 모든 것을 ax()로.
 * 토큰은 tokens.css 참조. claude.ai 실측 기반.
 *
 * Layer 분리: recipe(구조 잠금) + state(상태 잠금)
 * @layer 순서는 layers.css가 선언. state가 recipe를 이긴다.
 */

/* ════════════════════════════════════════════
 * Surface→Text pairing tokens (Material on-*)
 * --text-on-* = surface별 기본 전경색. tone 미주입 시 fallback.
 * surface의 color는 var(--_fg, var(--text-on-{surface}))
 *   — tone 주입 시 --_fg 우선, 미주입 시 surface 자동 파생.
 * inverted surface는 내부에서 --text-* 토큰 체인을 재할당하여
 * 하위 요소 전체의 text 색상을 역전시킨다 (sf-inverted 블록 참고).
 * ════════════════════════════════════════════ */

@layer tokens {
  :root {
    --text-on-action:   var(--tone-primary-foreground);
    --text-on-input:    var(--text-primary);
    --text-on-display:  var(--text-primary);
    --text-on-overlay:  var(--text-primary);
    --text-on-sunken:   var(--text-primary);
    --text-on-base:     var(--text-primary);
    --text-on-raised:   var(--text-primary);
    --text-on-ghost:    inherit;
    --text-on-inverted: var(--text-bright-inverted);
  }
}

@layer state {

/* ════════════════════════════════════════════
 * Surface — "이 요소는 사용자와 어떤 관계인가"
 * 번들: cursor + border + background + color + 상태 정책
 * ════════════════════════════════════════════ */

.sf-action {
  cursor: pointer;
  user-select: none;
  border: none;
  background: var(--_bg, transparent);
  color: var(--_fg, var(--text-on-action));
  transition: color 150ms, background-color 150ms, box-shadow 150ms;
}
.sf-action:hover { background: var(--_bg-hover, var(--bg-hover)); }
.sf-action:active { background: var(--_bg-active, var(--bg-active)); }
.sf-action:focus-visible { outline: none; box-shadow: var(--focus-ring-shadow); }
.sf-action[aria-disabled="true"],
.sf-action:disabled { opacity: 0.5; pointer-events: none; cursor: not-allowed; }

.sf-input {
  border: 1px solid var(--border-strong);
  background: var(--_bg, var(--surface-default));
  color: var(--_fg, var(--text-on-input));
  box-shadow: var(--shadow-xs);
  transition: color 150ms, box-shadow 150ms, border-color 150ms;
  /* border가 role의 min-height를 깨뜨리지 않도록 padding 보정 */
  padding-block: calc(var(--space-sm) - 1px);
}
textarea.sf-input { field-sizing: content; }
.sf-input:focus-within { border-color: var(--focus); }
.sf-input:focus-visible { outline: none; border-color: var(--focus); box-shadow: var(--focus-ring-shadow); }
.sf-input[aria-invalid="true"] { border-color: var(--tone-destructive-base); }
.sf-input[aria-disabled="true"],
.sf-input:disabled { opacity: 0.5; pointer-events: none; cursor: not-allowed; }

.sf-display {
  border: 1px solid var(--border-subtle);
  background: var(--_bg, var(--surface-default));
  color: var(--_fg, var(--text-on-display));
}

.sf-overlay {
  background: var(--_bg, var(--surface-overlay));
  color: var(--_fg, var(--text-on-overlay));
  box-shadow: var(--shadow-lg);
  border: 1px solid var(--border-strong);
  z-index: 10;
  position: relative;
  --bg-hover:  var(--depth-overlay-hover);
  --bg-active: var(--depth-overlay-active);
  /* selection은 surface 불변 — :root 값 사용 */
}

/* Entry animation — popover/dialog 전용, surface와 분리 */
.sf-overlay[popover],
dialog.sf-overlay {
  opacity: 0;
  transform: scale(0.95);
  transition: opacity var(--motion-enter-duration) var(--motion-enter-easing),
              transform var(--motion-enter-duration) var(--motion-enter-easing),
              display var(--motion-enter-duration) var(--motion-enter-easing) allow-discrete,
              overlay var(--motion-enter-duration) var(--motion-enter-easing) allow-discrete;
}

.sf-overlay:popover-open,
dialog.sf-overlay[open] {
  opacity: 1;
  transform: scale(1);
}

@starting-style {
  .sf-overlay:popover-open,
  dialog.sf-overlay[open] {
    opacity: 0;
    transform: scale(0.95);
  }
}

/* Light-reflection gradient border — top-lit glass edge */
.sf-overlay::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 1px;
  background: linear-gradient(
    180deg,
    var(--overlay-edge-top)    0%,
    var(--overlay-edge-bottom) 100%
  );
  -webkit-mask:
    linear-gradient(#fff 0 0) content-box,
    linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask:
    linear-gradient(#fff 0 0) content-box,
    linear-gradient(#fff 0 0);
  mask-composite: exclude;
  pointer-events: none;
  z-index: 1;
}

.sf-sunken {
  background: var(--_bg, var(--surface-sunken));
  color: var(--_fg, var(--text-on-sunken));
  border: none;
  --bg-hover:  var(--depth-sunken-hover);
  --bg-active: var(--depth-sunken-active);
}

.sf-base {
  background: var(--_bg, var(--surface-base));
  color: var(--_fg, var(--text-on-base));
  border: none;
  --bg-hover:  var(--depth-base-hover);
  --bg-active: var(--depth-base-active);
}

.sf-raised {
  background: var(--_bg, var(--surface-raised));
  color: var(--_fg, var(--text-on-raised));
  border: none;
  box-shadow: var(--shadow-md);
  --bg-hover:  var(--depth-raised-hover);
  --bg-active: var(--depth-raised-active);
}

.sf-inverted {
  background: var(--text-primary);
  color: var(--_fg, var(--text-on-inverted));
  border: none;
  /* 역전 맥락 — focus/text 모두 반전된 토큰 쓰기 (cascade로 하위 요소 자동 적용) */
  --focus:          var(--focus-inverted);
  --text-bright:    var(--text-bright-inverted);
  --text-primary:   var(--text-primary-inverted);
  --text-secondary: var(--text-secondary-inverted);
  --text-muted:     var(--text-muted-inverted);
}

.sf-placeholder {
  cursor: pointer;
  user-select: none;
  border: 1px dashed var(--border-subtle);
  background: var(--_bg, transparent);
  color: var(--text-muted);
}
.sf-placeholder:hover { border-color: var(--tone-primary-base); color: var(--tone-primary-base); }
.sf-placeholder:focus-visible { outline: none; border-color: var(--focus); box-shadow: var(--focus-ring-shadow); }
.sf-placeholder[aria-disabled="true"] { opacity: 0.5; pointer-events: none; cursor: not-allowed; }

.sf-ghost {
  cursor: pointer;
  user-select: none;
  border: none;
  background: transparent;
  color: var(--_fg, var(--text-on-ghost));
  transition: color 150ms, background-color 150ms;
}
.sf-ghost:hover { background: var(--bg-hover); }
.sf-ghost:active { background: var(--bg-active); }
.sf-ghost:focus-visible { outline: none; box-shadow: var(--focus-ring-shadow); }
.sf-ghost[aria-disabled="true"] { opacity: 0.5; pointer-events: none; cursor: not-allowed; }

} /* @layer state — Surface */

.rc-container    { /* size identity: none — semantic marker */ }

.ts-hero {

  font-family: var(--type-hero-family);
  line-height: var(--type-hero-line-height);

}

  letter-spacing: var(--type-display-letter-spacing);
}
.ts-page {
  font-size: var(--type-page-size);
  font-weight: var(--type-page-weight);
  font-family: var(--type-page-family);
  line-height: var(--type-page-line-height);
  letter-spacing: var(--type-page-letter-spacing);
}
.ts-section {

 * ════════════════════════════════════════════ */

.rl-control {
  min-height: var(--control-height);
  min-width: var(--control-height);
  font-size: var(--type-control-size);
  font-weight: var(--type-control-weight);

  flex-direction: row;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  cursor: pointer;
  user-select: none;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  transition: color 150ms, background-color 150ms, box-shadow 150ms;
}

  height: 1em;
  flex-shrink: 0;
  pointer-events: none;
}

  padding: 0;
  aspect-ratio: 1;
  justify-content: center;
}

/* ════════════════════════════════════════════
 * Role: ControlGroup — 필드형 복합 컨트롤의 외곽 셸
 * Spinbutton [- 1 +], Combobox [input ▾] 등.
 * 크기 SSOT: 내부 part는 role 없이 stretch로 높이를 채움.
 * ════════════════════════════════════════════ */

.rl-control-group {
  min-height: var(--control-height);
  font-size: var(--type-control-size);
  font-weight: var(--type-control-weight);
  gap: 0;
  border-radius: var(--shape-sm-radius);
  display: inline-flex;
  flex-direction: row;
  align-items: stretch;
  cursor: pointer;
  user-select: none;
  overflow: hidden;
}

/* control-group 내부의 control은 크기를 그룹에 위임 */
.rl-control-group .rl-control {
  min-height: unset;
  min-width: unset;
  border-radius: 0;
  font-size: inherit;
  font-weight: inherit;
}

/* ════════════════════════════════════════════
 * Role: Item — 리스트/메뉴/트리/사이드바 아이템의 크기 정체성
 * role이 크기(height/font/padding/gap/shape)를 소유한다.
 * width, layout, interactive는 미소유 — 컴포넌트가 명시.
 * ════════════════════════════════════════════ */

.rl-item {
  min-height: var(--item-height);
  font-size: var(--type-body-size);
  font-weight: var(--type-body-weight);

  padding-inline: calc(var(--space-xs) * var(--pd-ratio, 1));

  align-items: center;
  cursor: default;
  user-select: none;
}

/* ════════════════════════════════════════════
 * Role: Badge — 배지, 태그의 크기 정체성

 * ════════════════════════════════════════════ */

  flex-direction: row;
  align-items: center;
  justify-content: center;

} /* @layer recipe — Recipe, Control Size, Text Style */

.tn-neutral {
  --_bg: transparent;
  --_fg: var(--text-secondary);
  --_bg-hover: var(--bg-hover);
  --_bg-active: var(--bg-active);
}

/* ── Tone standalone text — :where() zero specificity, surface가 있으면 surface의 color가 이긴다 ── */

:where(.tn-accent)      { color: var(--tone-primary-base); }
:where(.tn-danger)      { color: var(--tone-destructive-base); }
:where(.tn-success)     { color: var(--tone-success-base); }
:where(.tn-warning)     { color: var(--tone-warning-base); }
:where(.tn-neutral)     { color: var(--text-secondary); }

/* ── Tone dim — 연한 배경, 진한 전경 (배지, 버블, 하이라이트) ── */

.tn-accent-dim {
  --_bg: var(--tone-primary-dim);
  --_fg: var(--tone-primary-hover);
  --_bg-hover: var(--tone-primary-mid);
  --_bg-active: var(--tone-primary-dim);
}
.tn-danger-dim {
  --_bg: var(--tone-destructive-dim);
  --_fg: var(--tone-destructive-hover);
  --_bg-hover: var(--tone-destructive-mid);
  --_bg-active: var(--tone-destructive-dim);
}
.tn-success-dim {
  --_bg: var(--tone-success-dim);
  --_fg: var(--tone-success-hover);
  --_bg-hover: var(--tone-success-mid);
  --_bg-active: var(--tone-success-dim);
}
.tn-warning-dim {
  --_bg: var(--tone-warning-dim);
  --_fg: var(--tone-warning-hover);
  --_bg-hover: var(--tone-warning-mid);
  --_bg-active: var(--tone-warning-dim);
}
.tn-neutral-dim {
  --_bg: var(--bg-hover);
  --_fg: var(--text-secondary);
  --_bg-hover: var(--bg-active);
  --_bg-active: var(--bg-hover);
}

:where(.tn-accent-dim)  { color: var(--tone-primary-hover); }
:where(.tn-danger-dim)  { color: var(--tone-destructive-hover); }
:where(.tn-success-dim) { color: var(--tone-success-hover); }
:where(.tn-warning-dim) { color: var(--tone-warning-hover); }
:where(.tn-neutral-dim) { color: var(--text-secondary); }

/* ── Role: Control — interactive 상태 ── */
.rl-control:hover { background: var(--_bg-hover, var(--bg-hover)); }
.rl-control:active { background: var(--_bg-active, var(--bg-active)); }
.rl-control:focus-visible { outline: none; box-shadow: var(--focus-ring-shadow); }
.rl-control[aria-disabled="true"],
.rl-control:disabled { opacity: 0.5; pointer-events: none; cursor: not-allowed; }

} /* @layer state — Tone */

@layer recipe {

/* ════════════════════════════════════════════
 * Content — 콘텐츠 유형에 ��른 padding inline 비율
 * padding 축의 calc(... * var(--pd-ratio, 1))을 구동
 * ════════════════════════════════════════════ */

.ct-text   { --pd-ratio: 2; }
.ct-code   { --pd-ratio: 0; }
.ct-bubble { --pd-ratio: 2; }
.ct-icon {
  padding: 0;
  justify-content: center;
  align-content: center;
}

/* ════════════════════════════════════════════
 * Border — 테두리
 * 전체: subtle/default/strong (4면 모두)
 * 단면: bottom/top/start/end (구분선, subtle 색상)
 * ════════════════════════════════════════════ */

.bd-subtle  { border: var(--border-width) solid var(--border-subtle); }
.bd-dashed  { border: var(--border-width) dashed var(--border-subtle); }
.bd-default { border: var(--border-width) solid var(--border-default); }
.bd-strong  { border: var(--border-width) solid var(--border-strong); }
.bd-bottom  { border-bottom: var(--border-width) solid var(--border-subtle); }
.bd-top     { border-top: var(--border-width) solid var(--border-subtle); }
.bd-start   { border-inline-start: var(--border-width) solid var(--border-subtle); }
.bd-end     { border-inline-end: var(--border-width) solid var(--border-subtle); }
.bd-ring    { --bd-ring: 0 0 0 1px oklch(from var(--text-primary) l c h / 0.10); box-shadow: var(--bd-ring); }
.bd-ring:focus-visible { box-shadow: var(--bd-ring), var(--focus-ring-shadow); }

/* ════════════════════════════════════════════
 * Shape — 비-컨트롤 요소의 border-radius
 * 컨트롤(button/input 등)은 controlSize가 소유
 * ════════════════════════════════════════════ */

.sh-none { border-radius: 0; }
.sh-2xs  { border-radius: var(--shape-2xs-radius); } /*  2px */
.sh-xs   { border-radius: var(--shape-xs-radius); }  /*  4px */
.sh-sm   { border-radius: var(--shape-sm-radius); }  /*  6px */
.sh-md   { border-radius: var(--shape-md-radius); }  /*  8px */
.sh-lg   { border-radius: var(--shape-lg-radius); }  /* 12px */
.sh-xl   { border-radius: var(--shape-xl-radius); }  /* 16px */
.sh-pill { border-radius: var(--shape-pill-radius); }

/* ════════════════════════════════════════════
 * Layout — 역할 기반 구조 번들
 * display + direction + align + justify + overflow
 * claude.ai 실측: control=81% row+center+center
 * ════════════════════════════════════════════ */

.ly-row    { display: flex; flex-direction: row; }
.ly-center { display: flex; align-items: center; justify-content: center; }
.ly-bar    { display: flex; flex-direction: row; align-items: center; }
.ly-spread { display: flex; flex-direction: row; align-items: center; justify-content: space-between; }
.ly-stack  { display: flex; flex-direction: column; }
.ly-scroll   { display: flex; flex-direction: column; overflow-y: auto; block-size: 100%; min-width: 0; min-height: 0; scrollbar-gutter: stable; }
.ly-scroll-x { display: flex; flex-direction: row;    overflow-x: auto; block-size: 100%; min-width: 0; min-height: 0; }
.ly-scroll::-webkit-scrollbar { width: 6px; }
.ly-scroll::-webkit-scrollbar-thumb { background: transparent; border-radius: 3px; }
.ly-scroll:hover::-webkit-scrollbar-thumb { background: var(--border-default); }
/* clip — D2: 'scroll:hidden' 대체. overflow:clip (스크롤/포커스 잠금 + 자식이 밖으로 못 나옴) */
.ly-clip     { overflow: clip; }
/* 부모를 꽉 채우는 패인/분할창. 자식이 넘치면 클립. 콘텐츠는 내부에서 ly-scroll로 처리. */
.ly-fill     { display: flex; flex-direction: column; flex: 1; min-width: 0; min-height: 0; overflow: hidden; }
.ly-row-fill { display: flex; flex-direction: row; flex: 1; min-width: 0; min-height: 0; }
.ly-wrap     { display: inline-flex; flex-wrap: wrap; align-items: center; }
/* ── Grid — equal-column 그리드 ── */
.ly-grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); }
.ly-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); }
.ly-grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); }
.ly-grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); }
.ly-grid-7 { display: grid; grid-template-columns: repeat(7, 1fr); }
/* ── Table (CSS Grid subgrid) ── */
.ly-table {
  display: grid;
  grid-template-columns: var(--grid-columns, repeat(var(--grid-col-count, 4), 1fr));
}
.ly-table > .ax-interactive {
  display: grid;
  grid-template-columns: subgrid;
  grid-column: 1 / -1;
}
.ly-table .ax-interactive > :not([role="row"], [role="option"]) {
  grid-column: 1 / -1;
}
.ly-table [role="row"] {
  display: grid;
  grid-template-columns: subgrid;
  grid-column: 1 / -1;
}
.ly-table > [role="row"]:not(.ax-interactive [role="row"]),
.ly-table > [role="rowgroup"] {
  display: grid;
  grid-template-columns: subgrid;
  grid-column: 1 / -1;
}

/* ── Self-alignment — 자식이 부모 안에서의 위치 ── */
.ly-self-start  { align-self: flex-start; }
.ly-self-end    { align-self: flex-end; }
.ly-self-center { align-self: center; }

/* ════════════════════════════════════════════
 * Gap — 간격 스케일 (dense: xs~sm, breathing: md~xl)
 * ════════════════════════════════════════════ */

.g-xs  { gap: var(--space-xs); }   /*  4px */
.g-sm  { gap: var(--space-sm); }   /*  8px */
.g-md  { gap: var(--space-md); }   /* 16px */
.g-lg  { gap: var(--space-lg); }   /* 24px */
.g-xl  { gap: var(--space-xl); }   /* 32px */
.g-2xl { gap: var(--space-2xl); }  /* 48px */

/* ════════════════════════════════════════════
 * Padding — block 기본, inline은 content 축의 --pd-ratio로 스케일
 * content:'text' → inline 2배 (optical balance)
 * ════════════════════════════════════════════ */

.pd-none { padding: 0; }
.pd-xs   { padding-block: var(--space-xs);  padding-inline: calc(var(--space-xs) * var(--pd-ratio, 1)); }   /*  4px */
.pd-sm   { padding-block: var(--space-sm);  padding-inline: calc(var(--space-sm) * var(--pd-ratio, 1)); }   /*  8px */
.pd-md   { padding-block: var(--space-md);  padding-inline: calc(var(--space-md) * var(--pd-ratio, 1)); }   /* 16px */
.pd-lg   { padding-block: var(--space-lg);  padding-inline: calc(var(--space-lg) * var(--pd-ratio, 1)); }   /* 24px */
.pd-xl   { padding-block: var(--space-xl);  padding-inline: calc(var(--space-xl) * var(--pd-ratio, 1)); }   /* 32px */

/* ════════════════════════════════════════════
 * Width — 너비 제약
 * ════════════════════════════════════════════ */

.w-full { width: 100%; }
.w-auto { width: auto; }
.w-fit  { width: fit-content; }
.w-sm    { width: 100%; max-width: 200px; margin-inline: auto; }
.w-md    { width: 100%; max-width: 400px; margin-inline: auto; }
.w-lg    { width: 100%; max-width: 640px; margin-inline: auto; }
.w-xl    { width: 100%; max-width: 960px; margin-inline: auto; }
.w-prose { width: 100%; max-width: 72ch; margin-inline: auto; }

/* ════════════════════════════════════════════
 * Flex — flex item 크기
 * ════════════════════════════════════════════ */

.fx-none { flex: none; }
.fx-auto { flex: auto; }
.fx-1    { flex: 1; }

/* ════════════════════════════════════════════
 * Clamp — 텍스트 줄 수 제한
 * '1': nowrap + ellipsis (단일행)
 * '2'~'4': CSS line-clamp (다중행)
 * ════════════════════════════════════════════ */

/* ════════════════════════════════════════════
 * Motion — 반복/진입 애니메이션
 * transition은 어느 축도 소유하지 않음 — last-mile.
 * motion은 @keyframes 기반 반복/진입 애니메이션.
 * ════════════════════════════════════════════ */

@keyframes ax-pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

@keyframes ax-spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

@keyframes ax-fade-in {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes ax-slide-up {
  from { opacity: 0; transform: translateY(var(--space-sm)); }
  to { opacity: 1; transform: translateY(0); }
}

.mo-pulse    { animation: ax-pulse 1.5s ease-in-out infinite; }
.mo-spin     { animation: ax-spin 1s linear infinite; }
.mo-fade-in  { animation: ax-fade-in var(--motion-enter-duration) var(--motion-enter-easing) both; }
.mo-slide-up { animation: ax-slide-up var(--motion-enter-duration) var(--motion-enter-easing) both; }

@keyframes ax-fade-slide-in {
  from { opacity: 0; transform: translateY(var(--space-sm)); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes ax-slide-in {
  from { opacity: 0; transform: translateY(calc(-1 * var(--space-sm))); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes ax-scale-in {
  from { opacity: 0; transform: scale(0.95); }
  to { opacity: 1; transform: scale(1); }
}

@keyframes ax-blink {
  50% { opacity: 0; }
}

@keyframes ax-shimmer {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

.mo-fade-slide-in { animation: ax-fade-slide-in var(--motion-enter-duration) var(--motion-enter-easing) both; }
.mo-slide-in      { animation: ax-slide-in var(--motion-enter-duration) var(--motion-enter-easing) both; }
.mo-scale-in      { animation: ax-scale-in var(--motion-enter-duration) var(--motion-enter-easing) both; }
.mo-blink         { animation: ax-blink 0.8s step-end infinite; }
.mo-shimmer       { animation: ax-shimmer 1.5s ease-in-out infinite; }

/* ════════════════════════════════════════════
 * Clamp — 텍스트 줄 수 제한
 * '1': nowrap + ellipsis (단일행)
 * '2'~'4': CSS line-clamp (다중행)
 * ════════════════════════════════════════════ */

.cl-scroll { max-height: 300px; overflow-y: auto; }
.cl-1   { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cl-pre { white-space: pre; overflow: hidden; text-overflow: ellipsis; }
.cl-2 { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
.cl-3 { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
.cl-4 { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4; overflow: hidden; }

/* ── icon: SVG 크기 (width + height) ── */
.ic-xs { width: var(--icon-xs); height: var(--icon-xs); }
.ic-sm { width: var(--icon-sm); height: var(--icon-sm); }
.ic-md { width: var(--icon-md); height: var(--icon-md); }
.ic-lg { width: var(--icon-lg); height: var(--icon-lg); }

/* ════════════════════════════════════════════
 * Square — 정사각 크기 (비-SVG 요소: avatar, dot, swatch 등)
 * ════════════════════════════════════════════ */

.sq-xs  { width: var(--space-xs);  height: var(--space-xs); }   /*  4px */
.sq-sm  { width: var(--space-sm);  height: var(--space-sm); }   /*  8px */
.sq-md  { width: var(--space-md);  height: var(--space-md); }   /* 16px */
.sq-lg  { width: var(--space-lg);  height: var(--space-lg); }   /* 24px */
.sq-xl  { width: var(--space-xl);  height: var(--space-xl); }   /* 32px */
.sq-2xl { width: var(--space-2xl); height: var(--space-2xl); }  /* 48px */

/* ════════════════════════════════════════════
 * Aspect — 종횡비
 * ════════════════════════════════════════════ */

.ar-1     { aspect-ratio: 1; }
.ar-video { aspect-ratio: 16 / 9; }
.ar-card  { aspect-ratio: 1.4; }

/* ════════════════════════════════════════════
 * Atomic Utilities — 키워드 전용 (수치 없음)
 * module.css last-mile 제거용
 * ════════════════════════════════════════════ */

/* cursor */
.cursor-default { cursor: default; }
.cursor-pointer { cursor: pointer; }

/* overflow */
.overflow-hidden  { overflow: hidden; }
.overflow-auto    { overflow: auto; }
.overflow-y-auto  { overflow-y: auto; }
.overflow-x-auto  { overflow-x: auto; }
.overflow-x-hidden { overflow-x: hidden; }

/* text / white-space */
.text-right   { text-align: right; }
.text-center  { text-align: center; }
.text-left    { text-align: left; }
.pre-wrap     { white-space: pre-wrap; }
.break-word   { overflow-wrap: break-word; }
.tabular-nums { font-variant-numeric: tabular-nums; }

/* ── Placement — 의도 기반 배치 (position + inset + transform 번들) ── */
/* ② 2026-04-05-placement-axis-prd.md */
.pl-above         { position: absolute; bottom: 100%; left: 0; right: 0; }
.pl-below         { position: absolute; top: 100%; left: 0; right: 0; }
.pl-bottom        { position: absolute; bottom: 0; left: 0; right: 0; }
.pl-bottom-center { position: absolute; bottom: var(--space-md); left: 50%; transform: translateX(-50%); }
.pl-center        { position: absolute; inset: 0; margin: auto; width: fit-content; height: fit-content; }
.pl-top-start     { position: absolute; top: 0; inset-inline-start: 0; }
.pl-top-end       { position: absolute; top: 0; inset-inline-end: 0; }
.pl-viewport      { position: fixed; inset: 0; z-index: 100; }
.pl-sticky        { position: sticky; top: 0; z-index: 1; }
.pl-anchor-below        { position: fixed; inset: unset; position-area: block-end span-inline-end; position-try-fallbacks: flip-block; }
.pl-anchor-below-start  { position: fixed; inset: unset; position-area: block-end span-inline-start; position-try-fallbacks: flip-block; }
.pl-anchor-above        { position: fixed; inset: unset; position-area: block-start span-all; position-try-fallbacks: flip-block; }
.pl-anchor-end          { position: fixed; inset: unset; position-area: inline-end span-all; position-try-fallbacks: flip-inline; }
.pl-anchor-start        { position: fixed; inset: unset; position-area: inline-start span-all; position-try-fallbacks: flip-inline; }
.pl-relative      { position: relative; }
.pl-float-top-start     { position: fixed; top: var(--space-md); inset-inline-start: var(--space-md); z-index: 100; }
.pl-float-top-center    { position: fixed; top: var(--space-md); left: 50%; transform: translateX(-50%); z-index: 100; }
.pl-float-bottom-center { position: fixed; bottom: var(--space-lg); left: 50%; transform: translateX(-50%); z-index: 100; }
.pl-float-bottom        { position: fixed; bottom: 0; left: 0; right: 0; z-index: 100; }

/* layout helpers */
.relative { position: relative; }
.absolute { position: absolute; }
.inset-0  { inset: 0; }

/* HTML hidden attribute must always win over layout classes */
[hidden] { display: none !important; }

/* reset / misc */
.border-none     { border: none; }
.outline-none    { outline: none; }
.bg-transparent  { background: transparent; }
.select-none     { user-select: none; }
.select-text     { user-select: text; }
.pointer-none    { pointer-events: none; }
.pointer-auto    { pointer-events: auto; }
.font-inherit    { font-family: inherit; }
.ml-auto         { margin-left: auto; }
.border-collapse { border-collapse: collapse; }
.cursor-col-resize { cursor: col-resize; }
.cursor-row-resize { cursor: row-resize; }
.font-italic     { font-style: italic; }

/* ════════════════════════════════════════════
 * Global form element styling
 * placeholder, selection, aria-invalid
 * ════════════════════════════════════════════ */

input::placeholder,
textarea::placeholder { color: var(--text-muted); }

::selection { background: var(--tone-primary-dim); color: var(--text-bright); }

/* aria-invalid ring — input/textarea */
.sf-input[aria-invalid="true"] {
  box-shadow: 0 0 0 3px oklch(from var(--tone-destructive-base) l c h / 0.2);
}

} /* @layer recipe — Content~Placement~Utilities */

@layer state {

/* ════════════════════════════════════════════
 * Interactive — 동적 상태 시각 (hover/focus/selected/checked/disabled)
 * surface=정적(cursor/border/shadow), interactive=동적 상태 응답
 * .ax-interactive = 컨테이너 스코프 (:focus-within idle/active 판정)
 *
 * 모든 규칙 :where() → specificity (0,0,0). module.css override 가능.
 * 색상은 depth 토큰(--bg-hover, --selection 등)만 참조 → surface별 자동 적응.
 * ════════════════════════════════════════════ */

/* ── ia-item: option, treeitem, menuitem, row ── */

:where(.ia-item) {
  cursor: pointer;
  user-select: none;
  border-radius: var(--shape-xs-radius);
  outline: 1px solid transparent;
  outline-offset: -1px;
  transition: color 150ms, background-color 150ms;
}

/* hover (컨테이너 포커스 없을 때) */
:where(.ax-interactive:not(:focus-within) .ia-item:hover) {
  background: var(--bg-hover);
}

/* hover (컨테이너 포커스 있을 때, 비포커스 아이템만) */
:where(.ax-interactive:focus-within .ia-item:hover:not(:focus):not([data-focused])) {
  background: var(--bg-hover);
}

/* focus: idle (컨테이너 비활성) */
:where(.ax-interactive:not(:focus-within) .ia-item:focus),
:where(.ax-interactive:not(:focus-within) .ia-item[data-focused]) {
  background: var(--focus-idle);
}

/* focus: active (컨테이너 활성) */
:where(.ax-interactive:focus-within .ia-item:focus),
:where(.ax-interactive:focus-within .ia-item[data-focused]) {
  background: var(--tone-primary-dim);
  color: var(--text-bright);
  outline-color: var(--focus);
}

/* active (press) */
:where(.ia-item:active) {
  background: var(--tone-primary-bright);
}

/* selected — no :where() to win over surface bg */
.ia-item[aria-selected="true"] {
  background: var(--selection);
}

/* checked (radio, switch) */
.ia-item[aria-checked="true"] {
  background: var(--selection);
}

/* focused + selected compound */
.ia-item[aria-selected="true"]:focus,
.ia-item[aria-checked="true"]:focus,
.ia-item[aria-selected="true"][data-focused],
.ia-item[aria-checked="true"][data-focused] {
  background: var(--selection-cursor);
}

/* active pane override — container :focus-within 일 때 selection을 더 밝게 (Mac Finder 모델) */
.ax-interactive:focus-within {
  --selection:        var(--selection-active);
  --selection-cursor: var(--selection-cursor-active);
}

.ax-interactive:focus-within .ia-item[aria-selected="true"][data-focused],
.ax-interactive:focus-within .ia-item[aria-checked="true"][data-focused] {
  outline-color: var(--focus);
}

/* disabled */
.ia-item[aria-disabled="true"] {
  opacity: 0.4;
  pointer-events: none;
  cursor: default;
}

.ia-item[aria-disabled="true"][aria-selected="true"],

   ═══════════════════════════════════════════════════════════════════
   3 modes, independently togglable via body class or query param:
     ?inspect      → body.inspect       — role/interactive violation outline

   ═══════════════════════════════════════════════════════════════════ */

/* ── Mode 1: Role Violation Outline (?inspect) ──
   interactive(ia-*) without role(rl-*) = red outline (violation)
   proper role = subtle green (correct) */

@layer state {
  body.inspect .ia-item:not(.rl-control):not(.rl-control-group):not(.rl-item):not(.rl-badge),
  body.inspect .ia-tab:not(.rl-control):not(.rl-control-group):not(.rl-item):not(.rl-badge),
  body.inspect .ia-check:not(.rl-control):not(.rl-control-group):not(.rl-item):not(.rl-badge),
  body.inspect .ia-cell:not(.rl-control):not(.rl-control-group):not(.rl-item):not(.rl-badge),
  body.inspect .ia-input:not(.rl-control):not(.rl-control-group):not(.rl-item):not(.rl-badge),
  body.inspect .ia-button:not(.rl-control):not(.rl-control-group):not(.rl-item):not(.rl-badge) {
    outline: 3px solid rgba(255, 40, 40, 0.9);
    outline-offset: -2px;
  }

  body.inspect .rl-control,
  body.inspect .rl-control-group,
  body.inspect .rl-item,
  body.inspect .rl-badge {
    outline: 1px solid rgba(100, 200, 100, 0.3);
    outline-offset: -1px;
  }
}

/* ── Mode 2: Baseline Grid (?inspect-grid) ──
   8px horizontal grid — every element's height should land on these lines.
   LLM vision detects broken rhythm as pattern mismatch in the stripe overlay. */

@layer state {
  body.inspect-grid::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 99998;
    background-image:
      repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 7px,
        rgba(255, 60, 60, 0.25) 7px,
        rgba(255, 60, 60, 0.25) 8px
      );
    background-size: 100% 8px;
    background-position: top left;
  }

  /* 4px sub-grid — finer rhythm */
  body.inspect-grid::after {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 99999;
    background-image:
      repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(255, 60, 60, 0.08) 3px,
        rgba(255, 60, 60, 0.08) 4px
      );
    background-size: 100% 4px;
  }
}

/* ── Mode 3: Box-Model Color (?inspect-box) ──
   role = green tint, interactive = blue outline, surface = purple dot,
   layout container = orange tint.
   LLM vision sees color blocks and judges spacing uniformity. */

@layer state {
  /* Role elements — green: structural keyline elements */
  body.inspect-box .rl-control,
  body.inspect-box .rl-control-group,
  body.inspect-box .rl-item,
  body.inspect-box .rl-badge {
    background-image: linear-gradient(rgba(76, 175, 80, 0.10), rgba(76, 175, 80, 0.10));
    outline: 1px solid rgba(76, 175, 80, 0.35);
    outline-offset: -1px;
  }

  /* Interactive elements — blue dashed: clickable/focusable */
  body.inspect-box [class*="ia-"] {
    background-image: linear-gradient(rgba(33, 150, 243, 0.06), rgba(33, 150, 243, 0.06));
    outline: 1px dashed rgba(33, 150, 243, 0.30);
    outline-offset: -1px;
  }

  /* Surface elements — purple dotted: visual containers */
  body.inspect-box [class*="sf-"] {
    outline: 1px dotted rgba(156, 39, 176, 0.25);
    outline-offset: -1px;
  }

  /* Layout containers — orange: structural spacing */
  body.inspect-box [class*="ly-"] {
    background-image: linear-gradient(rgba(255, 152, 0, 0.06), rgba(255, 152, 0, 0.06));
    outline: 1px dotted rgba(255, 152, 0, 0.25);
    outline-offset: 0px;
  }
}

/* ── Mode 4: Keyline Projection (?inspect-keyline) ──
   SVG overlay via KeylineOverlay.tsx (src/devtools/).
