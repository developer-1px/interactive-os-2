# Miller Columns — 상태별 스크린샷 매니페스트
# 개발자가 증명해야 할 모든 상태

route: /docs

scenarios:
  - id: default
    description: 기본 상태 — 루트 폴더 목록 표시, 아무것도 선택 안 됨
    file: default.png

  - id: folder-selected
    description: 폴더 선택 — 1-projects/ 선택 시 하위 컬럼 표시
    file: folder-selected.png

  - id: deep-drill
    description: 깊은 탐색 — 3단계 이상 drill-in, 컬럼 3개+ 표시
    file: deep-drill.png

  - id: file-preview
    description: 파일 선택 — .md 파일 선택 시 프리뷰 패널 활성
    file: file-preview.png

  - id: many-items
    description: 많은 항목 — 한 컬럼에 10개+ 항목, 스크롤 발생
    file: many-items.png

  - id: empty-folder
    description: 빈 폴더 — 자식 없는 폴더 선택 시 빈 상태
    file: empty-folder.png
