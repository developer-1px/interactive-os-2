title: "뷰모드 전환 (List ↔ Columns)"
number: 4
group: Viewer
scope:
  description: |
    툴바에서 list(TreeGrid + Preview) ↔ columns(MillerColumns) 뷰모드를 전환한다.
    마지막 선택은 localStorage에 영속되어 새 탭에서도 유지된다.
  design: /screenshots/viewer-toolbar-clusters-removed.png

behaviors:
  - given: 기본 로드 (localStorage 없음)
    when: Viewer 진입
    then: list 모드로 시작 (TreeGrid + 우측 preview)
    status: done

  - given: list 모드
    when: 툴바에서 columns 아이콘 클릭
    then: MillerColumns로 전환, TreeGrid·Preview 숨김
    status: done

  - given: columns 모드
    when: 컬럼에서 파일 focus
    then: 다음 컬럼이 FilePanel preview로 고정 렌더
    status: done

  - given: columns 모드로 전환 후 새로고침
    when: 페이지 재진입
    then: columns 모드로 복원 (viewer-viewmode 키)
    status: done

  - given: list 모드에서 splitter 드래그
    when: tree-area ↔ preview 경계 이동
    then: 비율 저장 (FlatLayout resizable)
    status: done

  - given: columns 모드에서 miller 전용 필터 입력
    when: 필터 적용
    then: 각 컬럼이 필터링된 결과만 표시
    status: todo

decisions:
  - title: hidden 토글로 전환
    why: 언마운트 시 TreeGrid 확장 상태 소실. FlatLayout hidden 속성으로 두 트리를 동시 보존
  - title: localStorage 키 = viewer-viewmode
    why: 세션 간 일관성. 매 진입마다 기본값으로 되돌아오는 UX 피로 제거
