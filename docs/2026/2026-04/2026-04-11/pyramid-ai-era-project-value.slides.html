<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 시대 이 프로젝트가 중요한 이유</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif; background: #0a0a0a; color: #e0e0e0; height: 100vh; overflow: hidden; }
  .slide { display: none; flex-direction: column; justify-content: center; padding: 8vh 10vw; height: 100vh; }
  .slide.active { display: flex; }
  .slide.section { justify-content: center; align-items: center; }
  .slide.section h1 { font-size: clamp(2rem, 5vw, 4rem); font-weight: 700; line-height: 1.3; text-align: center; color: #fff; }
  .slide h2 { font-size: clamp(1.4rem, 3vw, 2.2rem); font-weight: 600; line-height: 1.4; margin-bottom: 3vh; color: #fff; }
  .slide .body { display: flex; flex-direction: column; gap: 1.2vh; }
  .slide .body .item { font-size: clamp(1rem, 1.8vw, 1.4rem); line-height: 1.6; color: #bbb; }
  .slide .body .item.d0 { color: #e0e0e0; font-size: clamp(1.1rem, 2vw, 1.5rem); }
  .slide .body .item.d1 { padding-left: 2em; }
  .slide .body .item.d2 { padding-left: 4em; font-size: clamp(0.9rem, 1.5vw, 1.2rem); color: #999; }
  .slide .body .item.d3 { padding-left: 6em; font-size: clamp(0.85rem, 1.3vw, 1.1rem); color: #777; }
  .counter { position: fixed; bottom: 2vh; right: 3vw; font-size: 0.9rem; color: #555; }
  .progress { position: fixed; top: 0; left: 0; height: 3px; background: #4a9eff; transition: width 0.3s; }
</style>
</head>
<body>
<div class="progress" id="progress"></div>
<div id="deck"></div>
<div class="counter" id="counter"></div>
<script>
const slides = [{"heading":"AI 시대 이 프로젝트가 중요한 이유","lines":[{"text":"LLM으로 백엔드/인프라/스크립트는 빠르게 만들 수 있게 됐다","depth":0},{"text":"그런데? UI도 잘 만드는 것처럼 보이지만, 수정할수록 망가지고 검증도 안 된다","depth":0},{"text":"그런데? 사용자향 서비스를 만들려면 여전히 UI가 필요하다","depth":0},{"text":"UI 없이는? 클로드 코드처럼 터미널로 성공한 사례도 있지만 대상이 개발자 — 일반 사용자는 터미널을 낯설어한다","depth":1}]},{"heading":"이대로 가면? 지금처럼 자유형 코드를 생성하면 — 수정할수록 망가지고, 조합 폭발로 검증 불가","level":"slide","lines":[{"text":"왜 망가지나? [R1-① 수정의 함정]","depth":1},{"text":"처음 만드는 건 잘한다 — HTML/CSS는 쉽고, 바이브코딩 데모도 UI 중심이다","depth":2},{"text":"그런데? 수정하면 망가진다 — 유지보수 구조 없이 수정하면 금세 관리 불가","depth":3},{"text":"피할 수 있나? 수정 안 할 수 없다 — 소프트웨어 유지보수에 수정은 불가피","depth":4},{"text":"왜 치명적인가? [R1-② 구조적 한계]","depth":1},{"text":"조합 폭발 — 경우의 수가 많아지면 누락 검증이 안 된다","depth":2},{"text":"틀리면 버그 — UI는 작동해야 하는 물건이라 고장이 용납 안 된다","depth":2},{"text":"그런데? LLM이 고장을 감지 못한다 — 시각적 결과를 텍스트로 검증할 수 없다","depth":3}]},{"heading":"되고 싶은 건? LLM이 만들어도 수정에 강하고 검증 가능한 UI를 만들 수 있어야 한다","level":"slide","lines":[]},{"heading":"그래서? 어떻게 하면 LLM이 수정에 강한 UI를 만들 수 있을까?","level":"section","lines":[]},{"heading":"답은? LLM이 UI를 조립할 수 있는 선언적 기반을 닦는다","level":"slide","lines":[{"text":"기존 대안은? [① 기존 대안 한계]","depth":1},{"text":"만들 수 있다와 효율적이다는 다르다","depth":2},{"text":"왜? LLM이 할 수 있어도 그 작업은 토큰이고 시간이고 비용이다 — 능력과 효율은 별개다","depth":3},{"text":"그래서? 선언적 구조는 중첩 조립 토큰 자체가 불필요하다 — 비용 구조가 다르다","depth":4},{"text":"기존 라이브러리는 데이터 조작을 다루지 않는다","depth":2},{"text":"어떻게? NormalizedData가 모든 데이터를 단일 형태로 통일한다","depth":3},{"text":"기존 대안과의 관계? Radix/BaseUI는 aria 5층 중 2층에 해당한다","depth":3},{"text":"어떻게 해결? [② 기술 우위]","depth":1},{"text":"선언적 조립이 LLM에게 더 다루기 쉽다","depth":2},{"text":"그래서? 선언적이기 때문에 잘못 만들 수 없는 구조가 가능하다","depth":3},{"text":"증거는? [P4-① 위험 증거]","depth":4},{"text":"AI 코드는 이슈가 1.7배 더 많다","depth":5},{"text":"19% 느려졌는데 빨라졌다고 착각한다","depth":5},{"text":"기존 도구는? [P4-② 기존 도구 한계]","depth":4},{"text":"바이브코딩은 70%까지 마법이고 30%는 벽이다","depth":5},{"text":"v0은 프론트만, Bolt은 데모 수준이다","depth":5},{"text":"해법은? [P4-③ aria의 해법]","depth":4},{"text":"하네스가 LLM의 우회를 구조적으로 막는다","depth":5},{"text":"LLM이 스스로 결과를 검증하는 devtools","depth":5},{"text":"왜 쉬운가? [P3-① LLM 본질]","depth":3},{"text":"LLM은 선형 예측 모델이라 순차 생성에 최적화, 이전 출력에 영향받는다","depth":4},{"text":"React 중첩은 위치 매칭+흩어진 스타일 조립이 필요한데 LLM은 산재 정보 취합이 부족하다","depth":4},{"text":"인간은 트리/그룹핑을 선호하지만 LLM은 선형 구조를 잘 처리한다 — LLM 관점의 쉬움이다","depth":4},{"text":"증거는? [P3-② 증거]","depth":3},{"text":"FlatLayout이 부품과 배치를 분리한다","depth":4},{"text":"Google A2UI도 구조화 데이터→UI로 수렴한다","depth":4},{"text":"Vercel도 JSON 스키마→컴포넌트로 수렴한다","depth":4},{"text":"시장은? [③ 시장 기회]","depth":1},{"text":"이 카테고리에 경쟁자가 없다","depth":2},{"text":"왜 기회인가? 바이브코딩 도구가 작동하려면 이 레이어가 필요하다","depth":3},{"text":"Plan A 직접 바이브코딩 도구를 만든다","depth":4},{"text":"선택 기준? 기회가 오면 A, 아니면 B로 시작한다","depth":5},{"text":"Plan B shadcn/ui처럼 LLM 친화 라이브러리로 제공한다","depth":4},{"text":"그래서? LLM이 UI를 잘 만드는 건 똑똑해서만이 아니라 조립할 기반이 있을 때다 — 이 기반을 만들어서 UI에 어려움을 겪는 사람들을 돕는다","depth":0}]}];
let idx = 0;
const deck = document.getElementById('deck');
const counter = document.getElementById('counter');
const progress = document.getElementById('progress');

slides.forEach((s, i) => {
  const div = document.createElement('div');
  div.className = 'slide' + (s.level === 'section' ? ' section' : '') + (i === 0 ? ' active' : '');
  div.dataset.idx = i;
  if (s.level === 'section') {
    div.innerHTML = '<h1>' + esc(s.heading) + '</h1>';
  } else {
    let html = '<h2>' + esc(s.heading) + '</h2><div class="body">';
    for (const item of s.lines) {
      const d = Math.min(item.depth, 3);
      html += '<div class="item d' + d + '">' + esc(item.text) + '</div>';
    }
    html += '</div>';
    div.innerHTML = html;
  }
  deck.appendChild(div);
});

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function go(n) {
  const next = Math.max(0, Math.min(slides.length - 1, idx + n));
  if (next === idx) return;
  deck.children[idx].classList.remove('active');
  idx = next;
  deck.children[idx].classList.add('active');
  counter.textContent = (idx + 1) + ' / ' + slides.length;
  progress.style.width = ((idx + 1) / slides.length * 100) + '%';
}

counter.textContent = '1 / ' + slides.length;
progress.style.width = (1 / slides.length * 100) + '%';

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') go(1);
  else if (e.key === 'ArrowLeft') go(-1);
});
document.addEventListener('click', e => {
  if (e.clientX > window.innerWidth / 2) go(1); else go(-1);
});
</script>
</body>
</html>
