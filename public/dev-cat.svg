<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Body -->
  <ellipse cx="100" cy="140" rx="55" ry="45" fill="#3a3a4a"/>
  <!-- Head -->
  <circle cx="100" cy="80" r="42" fill="#4a4a5c"/>
  <!-- Left ear -->
  <polygon points="65,50 55,15 80,42" fill="#4a4a5c"/>
  <polygon points="68,48 60,22 77,43" fill="#ffb6c1"/>
  <!-- Right ear -->
  <polygon points="135,50 145,15 120,42" fill="#4a4a5c"/>
  <polygon points="132,48 140,22 123,43" fill="#ffb6c1"/>
  <!-- Eyes -->
  <ellipse cx="82" cy="78" rx="10" ry="11" fill="#1a1a2e"/>
  <ellipse cx="118" cy="78" rx="10" ry="11" fill="#1a1a2e"/>
  <!-- Eye shine -->
  <circle cx="86" cy="74" r="4" fill="white" opacity="0.9"/>
  <circle cx="122" cy="74" r="4" fill="white" opacity="0.9"/>
  <circle cx="80" cy="80" r="2" fill="white" opacity="0.5"/>
  <circle cx="116" cy="80" r="2" fill="white" opacity="0.5"/>
  <!-- Nose -->
  <ellipse cx="100" cy="92" rx="4" ry="3" fill="#ffb6c1"/>
  <!-- Mouth -->
  <path d="M92,96 Q100,104 108,96" stroke="#2a2a3a" stroke-width="1.5" fill="none"/>
  <path d="M100,92 L100,96" stroke="#2a2a3a" stroke-width="1.5"/>
  <!-- Whiskers -->
  <line x1="56" y1="85" x2="78" y2="90" stroke="#6a6a7c" stroke-width="1" opacity="0.6"/>
  <line x1="56" y1="95" x2="78" y2="94" stroke="#6a6a7c" stroke-width="1" opacity="0.6"/>
  <line x1="144" y1="85" x2="122" y2="90" stroke="#6a6a7c" stroke-width="1" opacity="0.6"/>
  <line x1="144" y1="95" x2="122" y2="94" stroke="#6a6a7c" stroke-width="1" opacity="0.6"/>
  <!-- Laptop -->
  <rect x="60" y="135" rx="4" width="80" height="48" fill="#2d2d3d" stroke="#5a5aff" stroke-width="1.5"/>
  <!-- Screen glow -->
  <rect x="64" y="139" rx="2" width="72" height="36" fill="#1a1a2e"/>
  <!-- Code lines on screen -->
  <rect x="68" y="144" width="28" height="3" rx="1" fill="#5affb6" opacity="0.8"/>
  <rect x="68" y="150" width="40" height="3" rx="1" fill="#5ab6ff" opacity="0.7"/>
  <rect x="72" y="156" width="32" height="3" rx="1" fill="#ff9a5a" opacity="0.7"/>
  <rect x="72" y="162" width="24" height="3" rx="1" fill="#5affb6" opacity="0.6"/>
  <rect x="68" y="168" width="36" height="3" rx="1" fill="#c49aff" opacity="0.7"/>
  <!-- Keyboard base -->
  <path d="M55,183 L60,183 L60,186 Q100,192 140,186 L140,183 L145,183 L148,186 Q100,196 52,186 Z" fill="#2a2a3a"/>
  <!-- Paws on keyboard -->
  <ellipse cx="80" cy="134" rx="12" ry="8" fill="#4a4a5c"/>
  <ellipse cx="120" cy="134" rx="12" ry="8" fill="#4a4a5c"/>
  <!-- Paw pads -->
  <circle cx="76" cy="136" r="2.5" fill="#ffb6c1" opacity="0.7"/>
  <circle cx="84" cy="136" r="2.5" fill="#ffb6c1" opacity="0.7"/>
  <circle cx="116" cy="136" r="2.5" fill="#ffb6c1" opacity="0.7"/>
  <circle cx="124" cy="136" r="2.5" fill="#ffb6c1" opacity="0.7"/>
  <!-- Tail -->
  <path d="M155,150 Q170,130 165,110 Q162,100 155,105" stroke="#4a4a5c" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- Blush -->
  <ellipse cx="70" cy="94" rx="8" ry="5" fill="#ff9a9a" opacity="0.25"/>
  <ellipse cx="130" cy="94" rx="8" ry="5" fill="#ff9a9a" opacity="0.25"/>
</svg>
